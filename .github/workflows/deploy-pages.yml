name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/iphone-expense-tracker-wq430z, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cricket/package-lock.json
      - name: Build Cricket Scorer (Star Kala CC)
        working-directory: cricket
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cricket/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
